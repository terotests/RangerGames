// The Android app, natively: the engine as a native library
// (crates/rg_android, built into src/main/jniLibs by scripts/build-android.sh)
// and a Java host that paints its draw stream on a Canvas. The games' pack and
// the font are in src/main/assets. No WebView, no WebAssembly.
plugins {
    id "com.android.application"
}

android {
    namespace "fi.rangergames"
    compileSdk 34

    defaultConfig {
        applicationId "fi.rangergames"
        // Android 7.0: phones from 2016 on
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs as it is; use your own key for a store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress "rgpk", "ttf"
    }
}
