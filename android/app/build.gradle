// The Android app, natively: the engine as a native library
// (crates/rg_android, built into src/main/jniLibs by scripts/build-android.sh)
// and a Java host that paints its draw stream on a Canvas. The games' pack and
// the font are in src/main/assets. No WebView, no WebAssembly.
plugins {
    id "com.android.application"
}

android {
    namespace "fi.rangergames"
    compileSdk 34

    defaultConfig {
        // an app of its own from the same code (scripts/build-android.sh
        // RG_APP_ID / RG_APP_NAME): its own package beside RangerGames
        applicationId(project.findProperty("appId") ?: "fi.rangergames")
        resValue "string", "app_name", (project.findProperty("appName") ?: "RangerGames").toString()
        // Android 7.0: phones from 2016 on
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
        // the engine is built for these two (scripts/build-android.sh); the
        // OpenXR loader below has x86 libraries too, left out
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    // One key for every build (the Mac's and CI's), so a CI-built APK installs
    // over a Mac-built one (adb install -r) without wiping the phone's saves.
    // It is public on purpose: this app is only sideloaded. A store build needs
    // its own, secret key.
    signingConfigs {
        sideload {
            storeFile file("../sideload.keystore")
            storePassword "rangergames"
            keyAlias "rangergames"
            keyPassword "rangergames"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        resValues true
    }

    androidResources {
        noCompress "rgpk", "ttf"
    }
}

dependencies {
    // VR headsets: the Khronos OpenXR loader (Apache-2.0 OR MIT), which finds the
    // headset's runtime (crates/rg_android/src/xr_android.rs loads it)
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.58"
}
