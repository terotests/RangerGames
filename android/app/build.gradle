// The Android app, natively: the engine as a native library
// (crates/rg_android, built into src/main/jniLibs by scripts/build-android.sh)
// and a Java host that paints its draw stream on a Canvas. The games' pack and
// the font are in src/main/assets. No WebView, no WebAssembly.
plugins {
    id "com.android.application"
}

android {
    namespace "fi.rangergames"
    compileSdk 34

    defaultConfig {
        applicationId "fi.rangergames"
        // Android 7.0: phones from 2016 on
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    // One key for every build (the Mac's and CI's), so a CI-built APK installs
    // over a Mac-built one (adb install -r) without wiping the phone's saves.
    // It is public on purpose: this app is only sideloaded. A store build needs
    // its own, secret key.
    signingConfigs {
        sideload {
            storeFile file("../sideload.keystore")
            storePassword "rangergames"
            keyAlias "rangergames"
            keyPassword "rangergames"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress "rgpk", "ttf"
    }
}
