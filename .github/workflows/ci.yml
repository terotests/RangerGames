# Tests the engine and the games, builds the web version and the Android
# APK, and publishes the web version (and the playground, playground.html)
# on GitHub Pages from the default branch.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a branch or PR cancels its older run; on main every run
# goes on (merges come every few minutes, cancelling would mean Pages never
# gets published) and the pages job below keeps only the newest deploy
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .deps
          key: ${{ runner.os }}-rg-${{ hashFiles('scripts/setup.sh', 'Cargo.lock') }}
      - name: Dependencies (Ranger with EVG, ComponentEngine)
        run: bash scripts/setup.sh
      - name: Unit tests
        run: cargo test -p rg_core -p rg_engine -p rg_voice
      - name: rg_core stays in Ranger's Rust subset (JavaScript, C++, Go, Python)
        run: TARGETS="es6 cpp go python" bash scripts/check-ranger.sh
      - name: Valopeilit levels are solvable with their trays
        run: node tools/peilit/solve.ts
      - name: Every game runs headless
        run: cargo run --release -p rg_cli -- test games 600
      - name: Web build (public games only, for GitHub Pages)
        run: RG_PUBLIC=1 bash scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web

  android:
    # natively: the engine with the NDK (no WebView), the Java host with gradle
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .deps
          key: ${{ runner.os }}-rg-android-${{ hashFiles('scripts/setup.sh', 'Cargo.lock') }}
      - name: Dependencies (Ranger with EVG, ComponentEngine)
        run: bash scripts/setup.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RangerGames-apk
          path: android/app/build/outputs/apk/release/*.apk

  pages:
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    needs: engine
    runs-on: ubuntu-latest
    # one deploy at a time; a newer waiting deploy replaces an older waiting one
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v4
