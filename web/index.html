<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RangerGames</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #three { display: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; font: 600 20px "Fredoka", sans-serif; background: #1b1f3b; }
  #status small { margin-top: 12px; font-weight: 400; font-size: 14px; opacity: .7; max-width: 80%; text-align: center; }
  #debug { position: fixed; right: 4px; top: 4px; display: none; color: #0f0; font: 12px monospace; background: rgba(0,0,0,.5); padding: 2px 4px; }
</style>
</head>
<body>
<canvas id="three"></canvas>
<canvas id="screen"></canvas>
<div id="status">RangerGames<small>Ladataan…</small></div>
<div id="debug"></div>
<script src="js/wasi.js"></script>
<script src="js/painter.js"></script>
<script src="js/audio.js"></script>
<script src="js/three-bridge.js"></script>
<script src="js/host.js"></script>
<script>
  (function () {
    var status = document.getElementById("status");
    if (!window.WebAssembly) {
      status.innerHTML = "RangerGames<small>Tämä selain ei tue WebAssemblyä.</small>";
      return;
    }
    var host = new RgHost({
      canvas: document.getElementById("screen"),
      canvas3d: document.getElementById("three"),
      status: status,
      debug: document.getElementById("debug")
    });
    window.rgHost = host;
    host.boot("rg_web.wasm", "games.rgpk").catch(function (e) {
      console.error(e);
      status.innerHTML = "RangerGames<small>" + String(e.message || e) + "</small>";
    });
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js").catch(function () { });
    }
  })();
</script>
</body>
</html>
